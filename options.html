<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Research Tool</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--txt:#e8e9ec;--mudo:#868a94;--linha:#24262d;--campo:#14161a;--fundo:#0d0e11;--acento:#3b82f6;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:40px 20px}
  .cab{display:flex;align-items:center;gap:12px;margin:0 0 28px}
  .cab img{width:36px;height:36px;border-radius:9px}
  h1{font-size:17px;font-weight:600;margin:0}
  label{display:block;color:var(--mudo);font-size:12.5px;margin:16px 0 5px}
  .dica{color:var(--mudo);font-size:12px;margin:6px 0 0}
  .dica a{color:#7aa7ff}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--linha);border-radius:7px;background:var(--campo);color:var(--txt);font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--acento)}
  .linha{display:flex;gap:6px}
  button{padding:8px 12px;border:1px solid var(--linha);border-radius:7px;background:var(--campo);color:var(--txt);font:inherit;cursor:pointer;flex:none}
  button.pri{width:100%;margin-top:24px;background:var(--acento);border-color:var(--acento);color:#fff;font-weight:600}
  button.pri:hover{background:#2563eb}
  #ok{display:block;text-align:center;color:#4ade80;font-size:12.5px;height:18px;margin-top:8px;opacity:0;transition:opacity .2s}#ok.on{opacity:1}
  .gasto{margin-top:28px;padding-top:16px;border-top:1px solid var(--linha)}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:10px}.topo h2{font-size:14px;font-weight:600;margin:0}
  .topo select{width:auto}
  .grande{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:10px 0 2px;font-variant-numeric:tabular-nums}
  .grande small{font-size:13px;font-weight:400;color:var(--mudo);margin-left:6px;letter-spacing:0}
  .barra{height:6px;border-radius:6px;background:#1d2029;overflow:hidden;min-width:60px}.barra i{display:block;height:100%;background:linear-gradient(90deg,#4f63d6,#8fa5ff);border-radius:6px}
  .tab{overflow-x:auto;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th{color:var(--mudo);font-weight:500;font-size:12px;text-align:right;padding:6px;border-bottom:1px solid var(--linha);white-space:nowrap}
  td{padding:6px;border-bottom:1px solid var(--linha);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}tr.tot td{font-weight:600;border-bottom:0}
  #lg td,#lg th{font-size:12px}#lg td:nth-child(2),#lg th:nth-child(2){text-align:left}
  details{margin-top:14px}summary{cursor:pointer;color:var(--mudo)}
  .vazio{color:var(--mudo)}
  .lupas details{border-bottom:1px solid var(--linha);padding:8px 0}.lupas summary{cursor:pointer;color:var(--txt);font-size:13px}.lupas summary small{color:var(--mudo)}
  .lupas .tw{color:var(--mudo);font-size:12px;margin:6px 0}.axpt-rs-s{margin:6px 0 0;font-size:12px;color:#9a9da6}.axpt-rs-s b{color:var(--txt);font-weight:600}.axpt-rs ul,.lupas ul{margin:3px 0 0;padding-left:16px}.lupas li{margin:0 0 3px;font-size:12px;color:#9a9da6}.lupas a{color:#7aa7ff;text-decoration:none}.lupas a:hover{text-decoration:underline}.axpt-rs-m{color:#6f727b}
  .turbo{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;margin-top:20px}
  .turbo-txt{flex:1}.turbo-txt>span{color:var(--txt);font-size:13px}.turbo .dica{margin-top:3px}
  .sw{position:relative;display:inline-block;width:40px;height:23px;flex:none;margin-top:1px}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sld{position:absolute;inset:0;background:var(--campo);border:1px solid var(--linha);border-radius:999px;transition:.15s;cursor:pointer}
  .sld::before{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;background:#868a94;border-radius:50%;transition:.15s}
  .sw input:checked+.sld{background:var(--acento);border-color:var(--acento)}
  .sw input:checked+.sld::before{transform:translateX(17px);background:#fff}
</style></head><body><main>

<div class="cab"><img src="icons/128.png" alt=""><h1>Research Tool</h1></div>

<!-- data-t: texto vindo de idiomas.js na lingua escolhida (data-th: com link) -->
<label for="chave" data-t="o_key">API key</label>
<div class="linha"><input id="chave" type="password" autocomplete="off" placeholder="sk-ant-..."><button type="button" id="ver" data-t="o_show">Show</button></div>
<p class="dica" data-th="o_apiHint"></p>

<label for="idi" data-t="o_idi">Translate to</label>
<select id="idi"></select>

<label for="mc" data-t="o_mc">Analysis model</label>
<select id="mc"></select>

<label for="mr" data-t="o_mr">Summary model</label>
<select id="mr"></select>

<div class="turbo">
  <div class="turbo-txt"><span data-t="o_turbo">Turbo mode</span><p class="dica" data-t="o_turboHint"></p></div>
  <label class="sw"><input type="checkbox" id="turbo"><span class="sld"></span></label>
</div>

<div class="turbo">
  <div class="turbo-txt"><span data-t="o_sites">Read news articles</span><p class="dica" data-t="o_sitesHint"></p></div>
  <label class="sw"><input type="checkbox" id="sites"><span class="sld"></span></label>
</div>

<button class="pri" id="salvar" data-t="o_save">Save</button>
<span id="ok" data-t="o_saved">Saved</span>

<section class="gasto">
  <div class="topo"><h2 data-t="o_usage">Usage</h2>
    <select id="per"><option value="1" data-t="o_p1">Today</option><option value="7" data-t="o_p7">Last 7 days</option><option value="30" selected data-t="o_p30">Last 30 days</option><option value="9999" data-t="o_pAll">All time</option></select></div>
  <div class="grande" id="grande"></div>
  <span class="dica" data-t="o_usageHint"></span>
  <div class="tab"><table id="tb"></table></div>
  <details><summary data-t="o_recent">Recent calls</summary><div class="tab"><table id="lg"></table></div></details>
  <button id="zerar" style="margin-top:14px" data-t="o_clear">Clear history</button>
</section>

<section class="gasto lupas">
  <h2 style="font-size:14px;font-weight:600;margin:0" data-t="rs_hist">Magnifier history</h2>
  <p class="dica" data-t="rs_histHint"></p>
  <div id="lupas"></div>
</section>

</main><script src="idiomas.js"></script><script src="options.js"></script></body></html>
